version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip install --no-cache-dir -r requirements.txt
run:
  runtime-version: 3.11
  command: sh -c "python -m app.init_db && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  network:
    port: 8000
  env:
    - name: GEMINI_MODEL
      value: gemini-2.5-flash
